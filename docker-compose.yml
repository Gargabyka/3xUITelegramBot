services:
  vpn-bot:
    build: .
    container_name: vpn-bot
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Telegram__Token: "<TOKEN_PLACEHOLDER>"
      Telegram__AdminIds__0: "<ADMIN_ID_PLACEHOLDER>"
      # Адрес панели 3x-ui с webBasePath. Если 3x-ui в docker с network_mode: host —
      # используйте http://host.docker.internal:<порт>/<webBasePath>/ (см. extra_hosts ниже)
      XUi__ApiUrl: "http://host.docker.internal:2053/<WEB_BASE_PATH>/"
      # Settings -> Security -> API Token
      XUi__ApiToken: "<API_TOKEN_PLACEHOLDER>"
      # ID inbound'а VLESS + Reality (колонка ID в списке inbound'ов)
      XUi__InboundId: "1"
      ConnectionStrings__Sqlite: "Data Source=/data/vpn_bot.db"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/data
