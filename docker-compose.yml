services:
  vpn-bot:
    build: .
    container_name: vpn-bot
    restart: unless-stopped

    # Секреты не хранятся в этом файле: значения ${...} берутся
    #  - в Portainer — из Environment variables стека (сохраняются между redeploy);
    #  - локально — из файла .env рядом с этим файлом (образец — .env.example).
    # ${VAR:?текст} — обязательная переменная: без неё стек не развернётся, вместо бота с пустым токеном.
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Telegram__Token: "${TELEGRAM_TOKEN:?Задайте TELEGRAM_TOKEN}"
      Telegram__AdminIds__0: "${TELEGRAM_ADMIN_ID:?Задайте TELEGRAM_ADMIN_ID}"
      # Адрес панели 3x-ui с webBasePath. Если 3x-ui в docker с network_mode: host —
      # используйте http://host.docker.internal:<порт>/<webBasePath>/ (см. extra_hosts ниже)
      XUi__ApiUrl: "${XUI_API_URL:?Задайте XUI_API_URL}"
      # Settings -> Security -> API Token
      XUi__ApiToken: "${XUI_API_TOKEN:?Задайте XUI_API_TOKEN}"
      # Профили VLESS: ID inbound'а (колонка ID в панели), профиль, при необходимости Port для ссылки/QR.
      # ID у каждого сервера свои и задаются переменными. Не задан ID — профиля нет в боте
      # (нужен хотя бы один)
      XUi__Inbounds__0__Id: "${XUI_INBOUND_RAW_ID:-}"
      XUi__Inbounds__0__Profile: "VlessRaw"
      XUi__Inbounds__1__Id: "${XUI_INBOUND_XHTTP_ID:-}"
      XUi__Inbounds__1__Profile: "VlessXhttp"
      XUi__Inbounds__1__Flow: ""
      XUi__Inbounds__2__Id: "${XUI_INBOUND_XHTTP_CDN_ID:-}"
      XUi__Inbounds__2__Profile: "VlessXhttpCdn"
      XUi__Inbounds__2__Flow: ""
      XUi__Inbounds__2__Port: "${XUI_INBOUND_XHTTP_CDN_PORT:-443}"
      # amnezia-wg-easy (необязательно): веб-интерфейс и пароль (PASSWORD контейнера)
      AmneziaWg__Enabled: "${AMNEZIA_ENABLED:-true}"
      AmneziaWg__ApiUrl: "${AMNEZIA_API_URL:-http://host.docker.internal:51821/}"
      AmneziaWg__ApiPassword: "${AMNEZIA_PASSWORD:-}"
      ConnectionStrings__Sqlite: "Data Source=/data/vpn_bot.db"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/data
